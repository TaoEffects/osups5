# Publie une release (paquet PS5 et, si la compilation passe, une version
# macOS) quand un commit contenant « [release <tag>] » est poussé.
name: release

on:
  push:

permissions:
  contents: write

jobs:
  ps5:
    if: contains(github.event.head_commit.message, '[release ')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Outils
        run: sudo apt-get update && sudo apt-get install -y clang-18 lld-18 llvm-18 python3 zip unzip curl cmake ninja-build
      - name: Build PS5
        run: bash ps5/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ps5
          path: build/ps5/dist/PPSA99731.zip

  macos:
    if: contains(github.event.head_commit.message, '[release ')
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances
        run: brew install sdl2 curl pkg-config ninja dylibbundler
      - name: Build
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix curl)/lib/pkgconfig:$PKG_CONFIG_PATH"
          cmake -S . -B build/mac -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja -C build/mac rhythm-ps5
      - name: Paquet
        run: |
          mkdir -p dist/rhythm-ps5-macos
          cp build/mac/rhythm-ps5 dist/rhythm-ps5-macos/
          cp -R ps5/assets dist/rhythm-ps5-macos/assets
          cp LICENSE README.md dist/rhythm-ps5-macos/
          dylibbundler -od -b -x dist/rhythm-ps5-macos/rhythm-ps5 -d dist/rhythm-ps5-macos/libs -p @executable_path/libs
          cd dist && zip -qr rhythm-ps5-macos-arm64.zip rhythm-ps5-macos
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/rhythm-ps5-macos-arm64.zip

  release:
    needs: [ps5, macos]
    if: always() && needs.ps5.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Tag
        id: tag
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: echo "name=$(printf '%s' "$MSG" | sed -n 's/.*\[release \([^]]*\)\].*/\1/p' | head -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publier
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: rhythm-ps5 ${{ steps.tag.outputs.name }}
          prerelease: true
          body_path: .github/release-notes.md
          files: artifacts/**/*.zip
